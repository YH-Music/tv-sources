name: daily-mirror

# 每天凌晨(北京时间 02:35)把公开源池镜像进本仓库并同步 Gitee：
# 无魔法网络也能拉全频道（App 的 sources.txt 指向本仓库 mirror_*.m3u）
on:
  schedule:
    - cron: "35 18 * * *"
    # 11-04 加：傍晚第二班(北京 19:45)——晚高峰开闸前把白天新死的僵尸清掉，
    # 观众晚上拿到的清单=按晚高峰状态刚验过；凌晨班保留管白天观众
    - cron: "45 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 抓上游公开源并过滤（违禁词 + 分片级僵尸闸·提速版）
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse, re, sys, time, random, concurrent.futures as cf

          # ── 提速参数（11-12 血案：旧版全量下载首个分片 + 无上限无截止，
          #    连日撞 GitHub 6 小时墙被掐死/runner 失联。语义不变：只删明确 404/410）──
          DEADLINE   = time.monotonic() + 20 * 60   # 全局 20 分钟硬截止，到点收工，未验的一律保留
          POOL_BUDGET = 8 * 60                      # 单池验尸 8 分钟硬预算
          MAX_PROBE   = 600                         # 单池最多验 600 个去重 URL，超出随机抽验、其余保留
          TO          = 6                           # 单请求超时（秒）

          UPSTREAMS = {
              "mirror_guovin.m3u": "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv4/result.m3u",
              "mirror_yang.m3u":   "https://cdn.jsdelivr.net/gh/YanG-1989/m3u@main/Gather.m3u",
              "mirror_iptvorg.m3u":"https://iptv-org.github.io/iptv/countries/cn.m3u",
          }
          # 成人/违规 + 政治敏感频道名：大陆直连本来也播不了，留着只会触发 Gitee 机器审查
          BAD = re.compile(r"成人|色情|做爱|强奸|裸|18禁|麻豆|swag|黑丝|嫩模|淫|偷拍|艳舞|一级|无码|AV作|做ai|做a片|直播女|娇喘|换妻|淫乱|做爰|大纪元|新唐人|NTD|希望之聲|声援|法轮|自由亚洲|美国之音|VOA|RFA|BBC中文|CNN|日经亚洲|镜新闻|壹新闻|壹电视|TVBS|凤凰", re.I)

          HDR = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          def fetch(url, t=20, n=None, rng=False):
              """n=最多读 n 字节（连接后读完即断，不拖全文件）；rng=带 Range 只取头部"""
              h = dict(HDR)
              if rng: h["Range"] = "bytes=0-%d" % ((n or 4096) - 1)
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=t) as r:
                  return r.read(n) if n else r.read()

          # ── 僵尸闸（11-04 央视验尸案后加；11-12 提速改造）─────────────
          # 僵尸源 = master 节目单还活着、真实视频分片已 404。判定下钻到分片，
          # 但 master 和分片都只读头部 4KB——判 404/410 根本不需要下载内容本体。
          # 超时/403/连不上=可能是国内源对海外封锁，一律保留，宁漏不误杀。
          def seg_of(master_head, base):
              try:
                  seg = next(l.strip() for l in master_head.splitlines()
                             if l.strip() and not l.startswith("#"))
              except StopIteration:
                  return None
              if "://" in seg: return seg
              if seg.startswith("/"):
                  m = re.match(r"(https?://[^/]+)", base)
                  return m.group(1) + seg if m else None
              return base.split("?")[0].rpartition("/")[0] + "/" + seg

          def norm(u):
              """URL 里中文/空格等先 percent 编码，否则 urllib 直接 UnicodeEncodeError 漏验"""
              try:
                  return urllib.parse.quote(u, safe=":/?=&%#@+~,;$!")
              except Exception:
                  return u

          def is_dead(u):
              """True=确定死（master 或首个分片明确 404/410）；其余一律 False(保留)"""
              if time.monotonic() > DEADLINE:
                  return False  # 到点未验=保留
              u = norm(u)
              try:
                  body = fetch(u, TO, n=4096, rng=True)
              except urllib.error.HTTPError as e:
                  return e.code in (404, 410)
              except Exception:
                  return False
              if b"#EXTM3U" not in body[:2048]:
                  return False  # 非 m3u8（mp4/ts 直连或 html）或文件过短：无法按分片判，保留
              s = seg_of(body.decode("utf-8", "ignore"), u)
              if not s: return False
              try:
                  fetch(s, TO, n=4096, rng=True)
                  return False
              except urllib.error.HTTPError as e:
                  return e.code in (404, 410)
              except Exception:
                  return False

          def probe_pool(urls, name):
              urls = sorted(set(urls))
              if len(urls) > MAX_PROBE:
                  random.seed(42)
                  probe = random.sample(urls, MAX_PROBE)
                  print(f"[抽检] {name} 去重 URL {len(urls)} 条超上限，抽验 {MAX_PROBE} 条，其余保留")
              else:
                  probe = urls
              dead = set()
              ex = cf.ThreadPoolExecutor(32)
              futs = {ex.submit(is_dead, u): u for u in probe}
              try:
                  for f in cf.as_completed(futs, timeout=POOL_BUDGET):
                      try:
                          if f.result(): dead.add(futs[f])
                      except Exception:
                          pass
              except TimeoutError:
                  print(f"[到时] {name} 验尸超 8 分钟预算，未验完的一律保留")
              ex.shutdown(wait=False, cancel_futures=True)
              return dead

          ok = True
          t0 = time.monotonic()
          for name, url in UPSTREAMS.items():
              try:
                  text = fetch(url, 60).decode("utf-8", "ignore")
              except Exception as e:
                  print(f"[跳过] {name} 上游拉取失败: {e} —— 保留旧文件")
                  ok = False
                  continue
              # 第一遍：逐行状态机，违禁词过滤并收集 (EXTINF行, URL行) 对
              entries = []
              total = banned = 0
              skip_next = False
              pending_inf = None
              for raw in text.splitlines():
                  s = raw.strip()
                  if s.startswith("#EXTINF"):
                      if BAD.search(s):
                          banned += 1; skip_next = True; pending_inf = None
                      else:
                          total += 1; skip_next = False; pending_inf = raw
                      continue
                  if s.startswith("#") or not s:
                      continue  # 其余注释(#EXTVLCOPT等)/空行跳过
                  if skip_next:
                      skip_next = False
                      continue  # 违禁条目的 URL 行
                  if pending_inf is not None:
                      entries.append((pending_inf, s))
                      pending_inf = None
              # 第二遍：分片级僵尸验尸（仅 http/https 可测；rtmp 等原样保留）
              dead = probe_pool([u for _, u in entries if u.startswith("http")], name)
              kept = [(i, u) for i, u in entries if u not in dead]
              # 熔断：单文件删超 85%=闸误伤(上游挂了/网络故障)，保留旧文件
              # （阈值不能设太低：11-04 实测公开池僵尸率就有 70%，50% 会把正常清理也拦死）
              if total and (total - len(kept)) / total > 0.85:
                  print(f"[熔断] {name} 僵尸率 {(total-len(kept))}/{total} 超85%，疑误伤 —— 保留旧文件")
                  ok = False
                  continue
              # 上游异常缩水（<50 台）视为故障，不覆盖好文件
              if len(kept) < 50:
                  print(f"[跳过] {name} 活线仅 {len(kept)} 台，疑似上游故障 —— 保留旧文件")
                  ok = False
                  continue
              out = ["#EXTM3U"]
              for i, u in kept:
                  out.append(i); out.append(u)
              open(name, "w", encoding="utf-8").write("\n".join(out) + "\n")
              print(f"[完成] {name}: {len(kept)}/{total} 台（违禁 {banned}、僵尸清 {total-len(kept)} 条）")
          print(f"[总耗时] {time.monotonic()-t0:.0f} 秒")
          sys.exit(0 if ok else 0)
          PY

      - name: 推 GitHub
        run: |
          git config user.name "tv-sync-bot" && git config user.email "bot@localhost"
          for f in mirror_guovin mirror_yang mirror_iptvorg; do base64 -w0 $f.m3u > $f.b64; done
          git add mirror_*.m3u mirror_*.b64
          git commit -q -m "每日镜像同步 $(date -u +%F\ %R)UTC" || echo "无变化"
          git push -q origin main && echo "GitHub 完成"

      - name: 推 Gitee（国内直连镜像；guovin 只推 b64 防机器审查）
        run: |
          git clone -q --depth 1 "https://yh-music:${GITEE_TOKEN}@gitee.com/yh-music/tv-sources.git" gtdst
          cp mirror_yang.m3u mirror_iptvorg.m3u gtdst/
          for f in mirror_guovin mirror_yang mirror_iptvorg; do base64 -w0 $f.m3u > gtdst/$f.b64; done
          cd gtdst
          git config user.name "tv-sync-bot" && git config user.email "bot@localhost"
          git add -A
          git commit -q -m "每日镜像同步 $(date -u +%F\ %R)UTC" || echo "Gitee 无变化"
          git push -q origin main && echo "Gitee 完成"
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
